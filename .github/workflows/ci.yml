name: ci
run-name: ${{ github.event_name }} on ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            timeout_minutes: 25
            lane: package
          - os: ubuntu-latest
            system: x86_64-linux
            timeout_minutes: 25
            lane: fixtures
          - os: macos-latest
            system: aarch64-darwin
            timeout_minutes: 35
            lane: package
          - os: macos-latest
            system: aarch64-darwin
            timeout_minutes: 35
            lane: fixtures
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('**/*.nix', 'flake.lock') }}

      - name: Check selected Go toolchain
        if: matrix.lane == 'package'
        run: nix develop .#ci --command bash scripts/validation/check-go-toolchain.sh

      - name: Evaluate nix flake checks
        run: nix flake check --no-build

      - name: Build checked package
        if: matrix.lane == 'package'
        run: nix build --print-build-logs '.#checks.${{ matrix.system }}.notification'

      - name: Build remaining flake checks
        if: matrix.lane == 'fixtures'
        run: |
          check_names=$(
            nix eval --raw '.#checks.${{ matrix.system }}' \
              --apply 'checks: builtins.concatStringsSep "\n" (builtins.filter (name: name != "notification") (builtins.attrNames checks))'
          )
          if [[ -z "$check_names" ]]; then
            echo "No fixture checks found" >&2
            exit 1
          fi
          check_refs=()
          while IFS= read -r name; do
            check_refs+=(".#checks.${{ matrix.system }}.$name")
          done <<< "$check_names"
          nix build --print-build-logs "${check_refs[@]}"

      - name: Run nix build
        if: matrix.lane == 'package'
        run: nix build --print-build-logs

      - name: Run Go linters
        if: matrix.lane == 'package'
        run: nix develop .#ci --command golangci-lint run ./...

      - name: Validate agent skills
        if: matrix.lane == 'package'
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run '.#skill-check'

      - name: Run gitleaks history scan
        if: matrix.lane == 'package'
        run: nix develop .#ci --command gitleaks detect --verbose --redact

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', 'flake.lock') }}

      - name: Verify GitHub Actions lockfile provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#gh-actions-lock -- --verify

      - name: Run govulncheck
        run: nix develop .#ci --command govulncheck ./...

  security-report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', 'flake.lock') }}

      - name: Generate govulncheck SARIF
        id: govulncheck-sarif
        continue-on-error: true
        run: nix develop .#ci --command govulncheck -format=sarif ./... > govulncheck.sarif

      - name: Upload govulncheck SARIF
        if: steps.govulncheck-sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: govulncheck.sarif

  ci:
    needs: [check, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled"
            exit 1
          fi
          echo "All checks passed"
