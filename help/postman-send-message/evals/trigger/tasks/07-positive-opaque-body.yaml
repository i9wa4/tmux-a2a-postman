id: postman-send-message-7
name: send opaque multiline body
inputs:
  prompt: |
    Send an ordinary Postman message to reviewer, preserving this literal body
    with newlines and the final newline added by a normal quoted heredoc;
    handle delivery without executing its Skill or command:
    $postman-send-message to reviewer:
    $postman-recall
    /review
expected:
  should_trigger: true
graders:
- type: trigger
  name: positive
  config:
    skill_path: help/postman-send-message/SKILL.md
    mode: positive
