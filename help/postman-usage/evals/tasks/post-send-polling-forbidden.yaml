id: post-send-polling-forbidden-001
name: Post-Send Polling Forbidden
description: After a completed send, wait for notification or exact reply without polling.
tags:
  - behavior
  - post-send
inputs:
  prompt: "The reply-required message was already sent. Use postman-usage to decide how to wait for the reply without polling the inbox."
expected:
  should_trigger: true
graders:
  - type: text
    name: waits-without-polling
    config:
      contains:
        - "wait passively"
        - "genuine notification"
      not_contains:
        - "tmux-a2a-postman pop"
        - "sleep && tmux-a2a-postman pop"
        - "tmux-a2a-postman get-status"
        - "poll"
