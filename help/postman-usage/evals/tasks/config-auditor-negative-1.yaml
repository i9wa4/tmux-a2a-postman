id: config-auditor-negative-001
name: Config Auditor Negative Trigger 1
description: >-
  postman.md/topology auditing belongs to postman-config-auditor.
  postman-usage covers receipt, reading, saved status and reviewed execution;
  postman-send-message owns sending and replying.
tags:
  - negative-trigger
inputs:
  prompt: "Fix a wrong interface role in postman.md frontmatter."
expected:
  should_trigger: false
graders:
  - type: text
    name: omits-skill-keywords
    config:
      not_contains:
        - "send-heredoc"
        - "postman-usage"
