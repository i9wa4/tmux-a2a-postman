id: send-trigger-positive-001
name: Send Positive Trigger 1
description: A notification selects POP and complete archive reading before the send handoff.
tags:
  - positive-trigger
inputs:
  prompt: "A genuine Postman notification arrived. Use postman-usage to POP and read the entire archived request before I prepare an exact reply."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "tmux-a2a-postman pop"
        - "markdown_absolute_path"
        - "postman-send-message"
