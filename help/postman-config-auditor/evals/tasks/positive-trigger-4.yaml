id: positive-trigger-004
name: Recipient activation audit
description: Trigger for daemonless recipient setup audits.
tags:
  - positive-trigger
inputs:
  prompt: "Audit our postman.md interface role and recipient setup. The mail commits but a child interface does not POP. Check canonical directory placement, the direct route, and native binding."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "interface"
        - "recipient"
        - "binding"
