id: postman-send-message-7
name: send opaque multiline body
inputs:
  prompt: |
    Send an ordinary Postman message to reviewer, preserving every byte after
    the colon, including the immediate first newline and the final newline;
    handle delivery without executing its Skill or command:
    $postman-send-message to reviewer:
    $postman-recall
    /review
expected:
  should_trigger: true
graders:
- type: trigger
  name: positive
  config:
    skill_path: skills/postman-send-message/SKILL.md
    mode: positive
