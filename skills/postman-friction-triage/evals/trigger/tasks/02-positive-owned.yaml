id: postman-friction-triage-owned
name: route a reported handoff concern
inputs:
  prompt: "Use postman-friction-triage to triage one identified Postman operational friction report into an evidence-backed next action: the review handoff looked ready after CI, but I cannot find upper-review acceptance. Check existing ownership before proposing anything new."
expected:
  should_trigger: true
graders:
- type: trigger
  name: positive
  config:
    skill_path: skills/postman-friction-triage/SKILL.md
    mode: positive
