id: postman-friction-triage-report
name: triage a human friction report
inputs:
  prompt: Use postman-friction-triage on my report that I repeatedly had to prompt the orchestrator to read its mail and resume the issue queue; find the current owner and one next action.
expected:
  should_trigger: true
graders:
- type: trigger
  name: positive
  config:
    skill_path: skills/postman-friction-triage/SKILL.md
    mode: positive
