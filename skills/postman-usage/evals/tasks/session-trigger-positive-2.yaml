id: session-trigger-positive-002
name: Session Positive Trigger 2
description: Saved mailbox counts and observation times should trigger usage guidance.
tags:
  - positive-trigger
inputs:
  prompt: "Interpret get-status with outbound_count=2, failed_count=1, and an old last_capture_at. Explain which facts are known and which are unknown."
expected:
  should_trigger: true
graders:
  - type: text
    name: contains-keywords
    config:
      contains:
        - "outbound_count"
        - "failed_count"
        - "last_capture_at"
