name: postman-usage-trigger-eval
description: Deterministic offline mock-executor trigger-accuracy eval for postman-usage.
skill: postman-usage
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the skill complete trigger and anti-trigger checks?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the skill stay within behavior limits?
tasks:
  - "tasks/*.yaml"
