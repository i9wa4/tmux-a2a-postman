id: config-auditor-negative-001
name: Config Auditor Negative Trigger 1
description: >-
  postman.md and topology audits belong to postman-config-auditor. This
  negative case guards postman-usage's actual DO NOT USE FOR boundary.
tags:
  - negative-trigger
inputs:
  prompt: "Fix a wrong node name in postman.md's skill_path frontmatter."
expected:
  should_trigger: false
graders:
  - type: text
    name: omits-skill-keywords
    config:
      not_contains:
        - "send-heredoc"
        - "postman-usage"
