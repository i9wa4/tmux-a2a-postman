id: post-send-polling-forbidden-001
name: Post-Send Polling Forbidden
description: With no own unread mail, a reply-required send waits passively for a genuine notification or exact reply.
tags:
  - behavior
  - post-send
inputs:
  prompt: "Use postman-send-message to send a reply-required first-contact message to reviewer. The returned self-state reports no own unread mail; wait for the reply."
expected:
  should_trigger: true
graders:
  - type: text
    name: sends-without-polling
    config:
      contains:
        - "send-heredoc"
        - "POSTMAN_BODY"
        - "wait passively"
      not_contains:
        - "tmux-a2a-postman pop"
        - "sleep && tmux-a2a-postman pop"
        - "tmux-a2a-postman get-status"
